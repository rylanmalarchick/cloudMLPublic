[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudml-cbh"
version = "1.0.0"
description = "Cloud base height retrieval from NASA ER-2 IRAI imagery and ERA5 reanalysis (code for two papers)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rylan Malarchick", email = "malarchr@my.erau.edu"}]
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.7",
    "h5py>=3.14",
    "torch>=2.6",
    "torchvision>=0.21",
    "matplotlib>=3.10",
    "PyYAML>=6.0",
    "tqdm>=4.67",
]

[project.urls]
Repository = "https://github.com/rylanmalarchick/cloudMLPublic"

[tool.setuptools]
packages = ["src", "src.cbh_retrieval"]

[tool.ruff]
line-length = 100
target-version = "py311"
